<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d14"/>
      <stop offset="50%" stop-color="#0f1724"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(22, 34, 52, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 36, 0.75)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bgGrad)" stroke="rgba(16,185,129,0.3)" stroke-width="2"/>

  <!-- Brand Title -->
  <g transform="translate(500, 45)" text-anchor="middle">
    <rect x="-180" y="-25" width="360" height="42" rx="10" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.4)"/>
    <text y="3" fill="#34d399" font-family="Inter, sans-serif" font-size="20" font-weight="800" letter-spacing="1">🌱 GREENCORE SUSTAINABILITY OS v2.5</text>
  </g>

  <!-- Subtitle Engine Box -->
  <g transform="translate(500, 110)" text-anchor="middle">
    <rect x="-380" y="-20" width="760" height="38" rx="8" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.3)"/>
    <text y="4" fill="#38bdf8" font-family="Inter, sans-serif" font-size="13" font-weight="600">
      CORE MULTI-METRIC ENGINE (Weighted Index 0-100: Energy, Water, Waste, Mobility, Solar, Paper, AQI)
    </text>
  </g>

  <!-- Connectors -->
  <path d="M 500 130 L 500 160" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 120 160 L 880 160" stroke="#10b981" stroke-width="2"/>
  <path d="M 120 160 L 120 190" stroke="#10b981" stroke-width="2"/>
  <path d="M 310 160 L 310 190" stroke="#10b981" stroke-width="2"/>
  <path d="M 500 160 L 500 190" stroke="#10b981" stroke-width="2"/>
  <path d="M 690 160 L 690 190" stroke="#10b981" stroke-width="2"/>
  <path d="M 880 160 L 880 190" stroke="#10b981" stroke-width="2"/>

  <!-- Row 1 Cards (Primary Pillars) -->
  <!-- 1. Smart Home -->
  <g transform="translate(45, 195)">
    <rect width="150" height="110" rx="10" fill="url(#cardGrad)" stroke="rgba(16,185,129,0.3)"/>
    <text x="75" y="30" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="22">🏠</text>
    <text x="75" y="52" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">SMART HOME</text>
    <text x="75" y="70" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Solar &amp; AC IoT</text>
    <text x="75" y="88" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="600">Live Telemetry</text>
  </g>

  <!-- 2. Campus -->
  <g transform="translate(235, 195)">
    <rect width="150" height="110" rx="10" fill="url(#cardGrad)" stroke="rgba(6,182,212,0.3)"/>
    <text x="75" y="30" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="22">🎓</text>
    <text x="75" y="52" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">CAMPUS</text>
    <text x="75" y="70" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Dept Leaderboard</text>
    <text x="75" y="88" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="600">CS #1 (91.2 Pts)</text>
  </g>

  <!-- 3. Enterprise ESG -->
  <g transform="translate(425, 195)">
    <rect width="150" height="110" rx="10" fill="url(#cardGrad)" stroke="rgba(16,185,129,0.3)"/>
    <text x="75" y="30" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="22">🏢</text>
    <text x="75" y="52" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">ENTERPRISE</text>
    <text x="75" y="70" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Scope 1, 2, 3 CO2</text>
    <text x="75" y="88" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="600">GRI / ISSB Audit</text>
  </g>

  <!-- 4. City Municipal -->
  <g transform="translate(615, 195)">
    <rect width="150" height="110" rx="10" fill="url(#cardGrad)" stroke="rgba(245,158,11,0.3)"/>
    <text x="75" y="30" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="22">🏙️</text>
    <text x="75" y="52" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">CITY MUNICIPAL</text>
    <text x="75" y="70" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">78.4 / 100 Index</text>
    <text x="75" y="88" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="10" font-weight="600">AQI 42 &amp; EV Grid</text>
  </g>

  <!-- 5. Carbon Credit NFT -->
  <g transform="translate(805, 195)">
    <rect width="150" height="110" rx="10" fill="url(#cardGrad)" stroke="rgba(16,185,129,0.3)"/>
    <text x="75" y="30" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="22">💎</text>
    <text x="75" y="52" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">CARBON NFT</text>
    <text x="75" y="70" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Verra Cryptographic</text>
    <text x="75" y="88" text-anchor="middle" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="600">0x7f9a... Minted</text>
  </g>

  <!-- Row 2 (Innovation Layer) -->
  <g transform="translate(500, 345)" text-anchor="middle">
    <rect x="-440" y="-18" width="880" height="34" rx="8" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.25)"/>
    <text y="4" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="700">
      🧠 AI &amp; SENSING LAYER: 2030 Climate Earth AI • AR Spatial Thermal Heatmap • Vision Waste Classifier • Developer API • Voice Control
