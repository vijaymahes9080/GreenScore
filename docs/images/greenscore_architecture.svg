  </g>

  <!-- Footer Banner -->
  <g transform="translate(500, 480)" text-anchor="middle">
    <text fill="#64748b" font-family="Inter, sans-serif" font-size="12">
      Designed for MCA Capstone Project &amp; Enterprise ESG Infrastructure • Author: Vijay Mahes (Vijaypradhap2004@gmail.com)
    </text>
